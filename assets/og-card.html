<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<title>Front page — the social card</title>
<!--
  The picture a link to the front page unfurls into (og-card.png, 1200×630):
  the name and the line, on the front page's own sky going from dusk into the
  night, with three of the pieces from it. Regenerate with
  `node assets/build-card.mjs` after changing it.
-->
<style>
  @font-face { font-family: 'Instrument Serif'; src: url(fonts/instrument-serif.woff2) format('woff2'); }
  @font-face { font-family: 'Instrument Serif'; src: url(fonts/instrument-serif-italic.woff2) format('woff2'); font-style: italic; }
  @font-face { font-family: 'Outfit'; src: url(fonts/outfit.woff2) format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'Plex Mono'; src: url(fonts/plex-mono.woff2) format('woff2'); font-weight: 400; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; color: #f7f2ea; font-family: 'Outfit', sans-serif;
    background:
      radial-gradient(60% 70% at 18% 108%, rgba(255, 185, 120, .85), rgba(255, 185, 120, 0) 70%),
      linear-gradient(100deg, #2f3b78 0%, #27306a 26%, #1a2050 48%, #0c1029 72%, #05060d 100%);
  }
  #stars { position: absolute; inset: 0; }
  .sun { position: absolute; left: 330px; top: 470px; width: 150px; height: 150px; border-radius: 50%;
    background: radial-gradient(circle, #fff8e4 0 30%, #ffd79a 44%, rgba(255,176,104,.45) 58%, rgba(255,150,90,0) 72%); }
  .moon { position: absolute; left: 1090px; top: 46px; width: 56px; height: 56px; border-radius: 50%; box-shadow: inset -11px 5px 0 0 #f2ecdc; transform: rotate(-18deg); filter: drop-shadow(0 0 18px rgba(242,236,220,.35)); }
  .text { position: absolute; left: 70px; top: 70px; width: 600px; }
  .hour { margin: 0; display: flex; align-items: baseline; gap: 14px; }
  .hour b { font: italic 400 46px/1 'Instrument Serif', serif; color: #ffcf8a; }
  .hour span { font: 400 17px/1 'Plex Mono', monospace; letter-spacing: .12em; text-transform: uppercase; color: #ddd5e4; }
  h1 { margin: 22px 0 0; font: 400 104px/.9 'Instrument Serif', serif; letter-spacing: -.02em; }
  h1 em { color: #ffcf8a; }
  h2 { margin: 22px 0 0; font: italic 400 36px/1.15 'Instrument Serif', serif; }
  .line { margin: 18px 0 0; width: 520px; font: 400 21px/1.45 'Outfit', sans-serif; color: #e4dde9; }
  .url { position: absolute; left: 70px; bottom: 52px; margin: 0; padding: 9px 16px; border-radius: 999px; background: rgba(10,11,30,.55); font: 400 19px/1 'Plex Mono', monospace; }
  .shot { position: absolute; border-radius: 4px; overflow: hidden; background: #0b0b10;
    box-shadow: 0 0 0 1px rgba(255,255,255,.16), 0 40px 70px -28px rgba(0,0,0,.9); }
  .shot img { display: block; width: 100%; }
  .s1 { left: 700px; top: 82px; width: 430px; transform: rotate(-2deg); box-shadow: 0 0 0 1px rgba(255,180,110,.3), 0 0 90px -20px rgba(242,140,60,.6), 0 40px 70px -28px rgba(0,0,0,.9); }
  .s2 { left: 760px; top: 306px; width: 380px; transform: rotate(2.5deg); }
  .print { position: absolute; left: 660px; top: 300px; width: 150px; border-radius: 2px; transform: rotate(-5deg);
    box-shadow: 0 0 0 6px #f4efe6, 0 40px 60px -20px rgba(0,0,0,.85); }
</style>
</head>
<body>
  <canvas id="stars" width="1200" height="630"></canvas>
  <div class="sun"></div>
  <div class="moon"></div>
  <div class="text">
    <p class="hour"><b>Portfolio</b><span>Design engineer · Birmingham, UK</span></p>
    <h1>Mohamed <em>Sucule</em></h1>
    <h2>Interfaces, designed and built.</h2>
    <p class="line">A game lit by its own flame, a daily puzzle site, posters you would hang and a story told by scrolling. All live in the browser.</p>
  </div>
  <p class="url">mohamed-sucule.github.io/Projects</p>
  <div class="shot s1"><img src="media/ember.webp" alt="" /></div>
  <div class="shot s2"><img src="media/flurdle.webp" alt="" /></div>
  <img class="print" src="your-place-poster.webp" alt="" />
  <script>
    /* Stars, thicker towards the night end of the card. */
    const c = document.getElementById('stars').getContext('2d');
    let seed = 11;
    const rand = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
    for (let i = 0; i < 260; i++) {
      const x = rand() ** 0.55 * 1200;
      const y = rand() ** 1.4 * 560;
      c.globalAlpha = Math.min(1, (x / 1200) * 1.3) * (0.4 + rand() * 0.6);
      c.fillStyle = '#fffaf0';
      c.beginPath();
      c.arc(x, y, 0.4 + rand() ** 3 * 1.5, 0, Math.PI * 2);
      c.fill();
    }
  </script>
</body>
</html>
