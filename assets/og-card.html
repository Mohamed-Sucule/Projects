<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<title>Front page — the social card</title>
<!--
  The picture a link to the front page unfurls into (og-card.png, 1200×630):
  the name, the role, and the two posters, in the front page's own faces and
  colours. Regenerate with `node assets/build-card.mjs` after changing either.
-->
<style>
  @font-face { font-family: 'Fraunces'; src: url(fonts/fraunces.woff2) format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'Fraunces'; src: url(fonts/fraunces-italic.woff2) format('woff2'); font-weight: 100 900; font-style: italic; }
  @font-face { font-family: 'Outfit'; src: url(fonts/outfit.woff2) format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'Plex Mono'; src: url(fonts/plex-mono.woff2) format('woff2'); font-weight: 400; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #f6f5f1; color: #15171c; font-family: 'Outfit', sans-serif; position: relative; }
  .text { position: absolute; left: 72px; top: 78px; width: 640px; }
  .label { margin: 0; font: 400 19px/1 'Plex Mono', monospace; letter-spacing: .08em; text-transform: uppercase; color: #5a606d; }
  h1 { margin: 24px 0 0; font: 580 74px/1 'Fraunces', serif; letter-spacing: -.02em; white-space: nowrap; }
  h2 { margin: 18px 0 0; font: italic 460 42px/1.1 'Fraunces', serif; color: #1f4fd1; }
  .line { margin: 26px 0 0; width: 560px; font: 400 23px/1.45 'Outfit', sans-serif; color: #444955; }
  .url { position: absolute; left: 72px; bottom: 58px; margin: 0; font: 400 20px/1 'Plex Mono', monospace; color: #15171c; }
  .url::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #1f4fd1; margin-right: 12px; vertical-align: 2px; }
  .poster { position: absolute; width: 250px; box-shadow: 0 1px 2px rgba(21,23,28,.12), 0 30px 50px -24px rgba(21,23,28,.55); border-radius: 3px; }
  .p1 { left: 752px; top: 104px; transform: rotate(-4deg); }
  .p2 { left: 906px; top: 78px; transform: rotate(3.5deg); }
</style>
</head>
<body>
  <div class="text">
    <p class="label">Frontend engineer · Birmingham, UK</p>
    <h1>Mohamed Sucule</h1>
    <h2>React and TypeScript, fast and accessible.</h2>
    <p class="line">Two apps built end to end, live and tested: a map poster renderer and an astronomically accurate star chart.</p>
  </div>
  <p class="url">mohamed-sucule.github.io/Projects</p>
  <img class="poster p1" src="your-place-poster.webp" alt="" />
  <img class="poster p2" src="your-sky-poster.webp" alt="" />
</body>
</html>
