name: Deploy to GitHub Pages

# Publishes the whole repo as a static site. Almost everything is plain HTML
# and is uploaded as it is. The one exception is Your Place (React and
# TypeScript): its folder holds source, so the deploy builds it and puts the
# built app in that folder's place before uploading.
#
# ONE-TIME SETUP (about ten seconds, and it cannot be scripted — GitHub
# refuses to let a workflow token switch Pages on for the first time):
#
#   https://github.com/Mohamed-Sucule/Projects/settings/pages
#   → Build and deployment → Source → "GitHub Actions"
#
# After that, every push to main republishes the site automatically.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the test suite
        run: node tests/run.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            your-place/package-lock.json
            your-sky/package-lock.json
      - name: Build Your Place into /your-place/
        working-directory: your-place
        env:
          VITE_PORTFOLIO_URL: ../atlas/
        run: |
          npm ci
          npm test
          npm run build
      - name: Build Your Sky into /your-sky/
        working-directory: your-sky
        env:
          VITE_PORTFOLIO_URL: ../atlas/
        run: |
          npm ci
          npm test
          npm run build
      - name: Serve the built apps, not their source
        run: |
          for app in your-place your-sky; do
            mv "$app/dist" "$RUNNER_TEMP/$app"
            rm -rf "$app"
            mv "$RUNNER_TEMP/$app" "$app"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
