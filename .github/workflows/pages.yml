name: Deploy to GitHub Pages

# Publishes the whole repo as a static site. Almost everything is plain HTML
# and is uploaded as it is. The two exceptions are Your Place and Your Sky
# (React and TypeScript, in one npm workspace with the code they share): their
# folders hold source, so the deploy builds each one and puts the built app in
# that folder's place before uploading.
#
# ONE-TIME SETUP (about ten seconds, and it cannot be scripted — GitHub
# refuses to let a workflow token switch Pages on for the first time):
#
#   https://github.com/Mohamed-Sucule/Projects/settings/pages
#   → Build and deployment → Source → "GitHub Actions"
#
# After that, every push to main republishes the site automatically.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  site:
    name: Site checks
    uses: ./.github/workflows/site.yml

  deploy:
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install the apps' dependencies (one workspace, one lockfile)
        run: npm ci
      - name: Build Your Place into /your-place/
        env:
          VITE_PORTFOLIO_URL: ../atlas/
        run: |
          npm test -w poster-kit
          npm test -w your-place
          npm run build -w your-place
      - name: Build Your Sky into /your-sky/
        env:
          VITE_PORTFOLIO_URL: ../atlas/
        run: |
          npm test -w your-sky
          npm run build -w your-sky
      - name: Serve the built apps, not their source or dependencies
        run: |
          for app in your-place your-sky; do
            mv "$app/dist" "$RUNNER_TEMP/$app"
            rm -rf "$app"
            mv "$RUNNER_TEMP/$app" "$app"
          done
          rm -rf node_modules packages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
