name: Your Sky

# Your Sky's checks: formatting, lint, types and unit tests, then end-to-end tests
# on a desktop and a phone. They run whenever the app, the code it shares with
# its partner (packages/poster-kit) or the dependencies change. The steps are in
# react-app.yml, which both apps use.

on:
  push:
    branches: [main]
    paths: ['your-sky/**', 'packages/**', 'package.json', 'package-lock.json', '.github/workflows/your-sky.yml', '.github/workflows/react-app.yml']
  pull_request:
    paths: ['your-sky/**', 'packages/**', 'package.json', 'package-lock.json', '.github/workflows/your-sky.yml', '.github/workflows/react-app.yml']

permissions:
  contents: read

concurrency:
  group: your-sky-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    uses: ./.github/workflows/react-app.yml
    with:
      app: your-sky
