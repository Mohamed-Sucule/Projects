name: Tally

# Tests and offline evals for tally/ on every push and pull request that touches it.
# The model evals (real Claude calls, real cost) run only when started by hand from the Actions tab
# and only if the repository has an ANTHROPIC_API_KEY secret.

on:
  push:
    paths: ["tally/**", ".github/workflows/tally.yml", "render.yaml"]
  pull_request:
    paths: ["tally/**", ".github/workflows/tally.yml", "render.yaml"]
  workflow_dispatch:
    inputs:
      model_evals:
        description: "Also run the model evals (needs the ANTHROPIC_API_KEY secret; costs a few dollars)"
        type: boolean
        default: false
      qa_limit:
        description: "Only the first N QA questions (blank for all 50)"
        required: false

permissions:
  contents: read

defaults:
  run:
    working-directory: tally

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tally/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app evals tests data
      - name: Unit and API tests (scripted model, no network)
        run: python -m pytest
      - name: Offline evals (audit, retrieval, SQL sandbox, ingestion) must all pass
        run: python -m evals.run --out ../eval-reports --min-pass 1.0
      - name: Demo data regenerates byte for byte
        run: |
          python -m data.generate
          git diff --exit-code -- data
      - uses: actions/upload-artifact@v4
        with:
          name: offline-eval-reports
          path: eval-reports

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t tally .
      - name: Start it and check it answers
        run: |
          docker run -d --name tally -p 8000:8000 tally
          for i in $(seq 1 30); do curl -fsS localhost:8000/healthz && break; sleep 1; done
          curl -fsS localhost:8000/api/meta > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/api/documents)" = "403"

  model-evals:
    if: github.event_name == 'workflow_dispatch' && inputs.model_evals
    needs: test
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Check for the API key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add an ANTHROPIC_API_KEY repository secret to run the model evals."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tally/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run every suite against Claude
        run: python -m evals.run --all ${{ inputs.qa_limit && format('--limit {0}', inputs.qa_limit) || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: model-eval-reports
          path: tally/reports
