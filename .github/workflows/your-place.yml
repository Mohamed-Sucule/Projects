name: Your Place

# Your Place is the one React + TypeScript app in this repository, with its own
# toolchain, so it has its own checks. They run whenever its folder changes.

on:
  push:
    branches: [main]
    paths: ['your-place/**', '.github/workflows/your-place.yml']
  pull_request:
    paths: ['your-place/**', '.github/workflows/your-place.yml']

permissions:
  contents: read

concurrency:
  group: your-place-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: your-place

jobs:
  check:
    name: Format, lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: your-place/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: End-to-end (real Zurich tiles, desktop and phone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: your-place/package-lock.json
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: your-place/.cache
          key: your-place-map-fixtures-tileserver-gl-1.3.0
      - run: npm run fixtures
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: your-place-playwright-report
          path: your-place/playwright-report
          retention-days: 7
